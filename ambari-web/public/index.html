<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Web Project</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
  <!-- Then add other scripts -->
  <script src="vendor.js"></script>
  <script src="app.js"></script>
</head>
<body>
  <div id="wrapper-app"></div>
  <div id="root"></div>
  <!-- <button onclick="loadReact()">Switch to React</button>
  <button onclick="loadEmber()">Switch to Ember</button> -->
  <script>
      function loadReact() {
          console.log('Loading React latest');
          if (!window.location.href.includes("latest/#")) {
            window.location.href = 'latest/#';
          }
      }
      function loadEmber() {
          console.log('Loading Ember classic');
          if (!window.location.href.includes("classic/#")) {
            window.location.href = 'classic/#';
          }
      }

      if(window.location.href.includes("latest/#")){
        localStorage.setItem("version","latest")
      }
      if(window.location.href.includes("classic/#")){
        localStorage.setItem("version","classic")
      }
      const version = localStorage.getItem("version") || "latest";
      localStorage.setItem("version", version);
      if (version === "classic") {
        loadEmber();
      } else {
        loadReact();
      }
        </script>
</body>
</html>
