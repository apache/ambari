# Please make sure the format of the file is one of the following
# rpm.dependency.list=...
# rpm.dependency.list.[os_family_name]=...
# rpm.dependency.list.[os_family_name][starting_from_version]=...
# deb.dependency.list=...
# deb.dependency.list.[os_family_name]=...
# deb.dependency.list.[os_family_name][starting_from_version]=...
# 
# Examples:
# rpm.dependency.list.suse=openssl,\nRequires: python3 >= 3.9.2,\nRequires: python(abi) = 3.9 # for all suse family os
# rpm.dependency.list.suse11=curl # for all suse family os higher or equal to 11.
#
# Such a format is respected by install_ambari_tarball.py by default, 
# however should be encouraged manually in pom.xml.

rpm.dependency.list=openssl,\nRequires: (python39 >= 3.9.2 or python3 >= 3.9.2),\nRequires: python(abi) = 3.9,\nRequires: rpm,\nRequires: zlib,\nRequires: net-tools
rpm.dependency.list.redhat8=openssl,\nRequires: python39 >= 3.9.2,\nRequires: rpm,\nRequires: zlib,\nRequires: net-tools
rpm.dependency.list.redhat9=openssl,\nRequires: python3 >= 3.9.2,\nRequires: rpm,\nRequires: zlib,\nRequires: net-tools
rpm.dependency.list.suse=openssl,\nRequires: python3 >= 3.9.2,\nRequires: python(abi) = 3.9,\nRequires: rpm,\nRequires: zlib,\nRequires: net-tools
deb.dependency.list=openssl, net-tools, python3 (>= 3.9.2), python3 (<< 3.10)
