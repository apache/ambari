[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ambari-agent"
dynamic = ["version"]
description = "Apache Ambari Agent"
readme = "README.md"
requires-python = ">=3.9.2"
license = "Apache-2.0"
authors = [
    { name = "Apache Software Foundation", email = "dev@ambari.apache.org" },
]
keywords = ["hadoop", "ambari"]
dependencies = [
    "cryptography==50.0.1",
    "distro==1.9.0",
    "Jinja2==3.1.6",
    "APScheduler==3.11.3",
    "stomp.py==8.2.0",
    "websocket-client==1.9.0",
]

[project.urls]
homepage = "https://ambari.apache.org/"
documentation = "https://ambari.apache.org/"

[project.scripts]
ambari-agent = "ambari_agent.AmbariAgent:main"
