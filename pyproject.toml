[build-system]
requires = [
    "setuptools==82.0.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "ambari-python"
dynamic = ["version"]
description = "Apache Ambari is a tool for provisioning, managing, and monitoring Apache Hadoop clusters"
readme = "README.md"
requires-python = ">=3.9.2"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Apache Software Foundation", email = "dev@ambari.apache.org" },
]
keywords = ["hadoop", "ambari"]
dependencies = [
    "cryptography==50.0.1",
    "distro==1.9.0",
    "Jinja2==3.1.6",
]

[project.optional-dependencies]
agent = [
    "APScheduler==3.11.3",
    "stomp.py==8.2.0",
    "websocket-client==1.9.0",
]
server = [
    "javaproperties==0.8.2",
    "PyYAML==6.0.3",
]
test = []
tooling = [
    "ruff==0.12.11",
    "tomli==2.2.1; python_version < '3.11'",
]

[project.urls]
homepage = "https://ambari.apache.org/"
documentation = "https://ambari.apache.org/"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "ambari-web",
    "ambari-admin",
    "ambari-views",
    "ambari-utility",
    "ambari-server-spi",
    "docs",
    "target"
]

# Same as Black.
line-length = 88
indent-width = 2

# Match the minimum supported Ambari Python runtime.
target-version = "py39"

[tool.ruff.lint]
# Keep the initial gate limited to deterministic correctness failures. Broader
# style and import-order adoption belongs in separate mechanical changes.
select = [
    "E9",
    "F524",
    "F601",
    "F632",
    "F821",
    "F822",
    "F823",
    "W605",
]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Stack scripts receive some globals from Ambari's runtime loader.
"ambari-server/src/main/python/bootstrap.py" = ["F821"]
"ambari-server/src/main/resources/common-services/AMBARI_METRICS/3.0.0/package/scripts/ams.py" = ["F821"]
"ambari-server/src/main/resources/common-services/AMBARI_METRICS/3.0.0/package/scripts/hbase_master.py" = ["F821"]
"ambari-server/src/main/resources/common-services/AMBARI_METRICS/3.0.0/package/scripts/hbase_regionserver.py" = ["F821"]
"ambari-server/src/main/resources/common-services/AMBARI_METRICS/3.0.0/package/scripts/metrics_collector.py" = ["F821"]
"ambari-server/src/main/resources/stacks/BIGTOP/3.2.0/services/HBASE/package/scripts/hbase_master.py" = ["F821"]
"ambari-server/src/main/resources/stacks/BIGTOP/3.2.0/services/HBASE/package/scripts/hbase_regionserver.py" = ["F821"]
"ambari-server/src/main/resources/stacks/BIGTOP/3.2.0/services/HBASE/package/scripts/service_check.py" = ["F821"]
"ambari-server/src/main/resources/stacks/BIGTOP/3.2.0/services/HDFS/package/scripts/hdfs_datanode.py" = ["F821"]
"ambari-server/src/main/resources/stacks/BIGTOP/3.2.0/services/HDFS/package/scripts/hdfs_snamenode.py" = ["F821"]
"ambari-server/src/main/resources/stacks/BIGTOP/3.2.0/services/HDFS/package/scripts/journalnode.py" = ["F821"]
"ambari-server/src/main/resources/stacks/BIGTOP/3.2.0/services/HDFS/package/scripts/service_check.py" = ["F821"]
"ambari-server/src/main/resources/stacks/BIGTOP/3.2.0/services/YARN/package/scripts/mapred_service_check.py" = ["F821"]
"ambari-server/src/main/resources/stacks/BIGTOP/3.2.0/services/YARN/package/scripts/service.py" = ["F821"]
"ambari-server/src/main/resources/stacks/BIGTOP/3.2.0/services/YARN/package/scripts/service_check.py" = ["F821"]
"ambari-server/src/main/resources/stacks/BIGTOP/3.2.0/services/ZOOKEEPER/package/scripts/service_check.py" = ["F821"]
"ambari-server/src/main/resources/stacks/BIGTOP/3.2.0/services/ZOOKEEPER/package/scripts/zookeeper_client.py" = ["F821"]

# Stack-advisor fixture bases are injected by the test harness at load time.
"ambari-funtest/src/test/resources/stacks/XYZ/1.0.1/services/stack_advisor.py" = ["F821"]
"ambari-server/src/test/resources/stacks/XYZ/1.0.1/services/stack_advisor.py" = ["F821"]

[tool.ruff.lint.isort]
case-sensitive = false
combine-as-imports = true
force-sort-within-sections = false
known-first-party = []
known-third-party = []
lines-after-imports = -1
order-by-type = false
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder"
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
